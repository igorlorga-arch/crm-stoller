  if (!el) return;
  var msg = (e.message || 'Erro desconhecido');
  var loc = (e.filename || '') + ':' + (e.lineno || '') + ':' + (e.colno || '');
  var stack = (e.error && e.error.stack) ? e.error.stack : '';
  el.innerHTML = '<div style="padding:20px;font-family:monospace;font-size:13px;white-space:pre-wrap;color:#7a1f1f;background:#fbe4e0;min-height:100vh;">'
    + '⚠️ ERRO AO CARREGAR O APP\n\n' + msg + '\n\n' + loc + '\n\n' + stack + '</div>';
});
</script>

<script>
// ---------- local storage shim (mimics the Claude-artifact window.storage API) ----------
window.storage = {
  get: function (key) {
    return new Promise(function (resolve) {
      try {
        var raw = localStorage.getItem("crmrtv:" + key);
        if (raw === null) { resolve(null); return; }
        resolve({ key: key, value: raw, shared: false });
      } catch (e) { resolve(null); }
    });
  },
  set: function (key, value) {
    return new Promise(function (resolve) {
      try {
        localStorage.setItem("crmrtv:" + key, value);
        resolve({ key: key, value: value, shared: false });
      } catch (e) { resolve(null); }
    });
  },
  delete: function (key) {
    return new Promise(function (resolve) {
      try {
        localStorage.removeItem("crmrtv:" + key);
        resolve({ key: key, deleted: true, shared: false });
      } catch (e) { resolve(null); }
    });
  },
  list: function (prefix) {
    return new Promise(function (resolve) {
      try {
        var keys = [];
        var p = "crmrtv:" + (prefix || "");
        for (var i = 0; i < localStorage.length; i++) {
          var k = localStorage.key(i);
          if (k && k.indexOf(p) === 0) keys.push(k.slice(7));
        }
        resolve({ keys: keys, prefix: prefix, shared: false });
      } catch (e) { resolve(null); }
    });
  }
};
</script>

// ---------- storage ----------
const KEYS = { producers: "rtv:producers", visits: "rtv:visits", products: "rtv:products", sales: "rtv:sales" };
async function loadAll() {
  const out = {};
  for (const [k, key] of Object.entries(KEYS)) {
    try {
      const r = await window.storage.get(key, false);
      out[k] = r ? JSON.parse(r.value) : [];
    } catch { out[k] = []; }
  }
  return out;
}
async function save(key, value) {
  try { await window.storage.set(KEYS[key], JSON.stringify(value), false); } catch {}
}

    });

  useEffect(() => { if (ready) save("producers", producers); }, [producers, ready]);
  useEffect(() => { if (ready) save("visits", visits); }, [visits, ready]);
  useEffect(() => { if (ready) save("products", products); }, [products, ready]);

function Inicio({ producers, visits, products, sales, goTab }) {
  const [weather, setWeather] = useState(null);
  const [wLoading, setWLoading] = useState(false);
  const [city, setCity] = useState(producers[0]?.cidade || "");

  const today = new Date().toISOString().slice(0, 10);
  const proximasVisitas = visits
    .filter((v) => v.data >= today && v.status !== "Realizada")
    .sort((a, b) => a.data.localeCompare(b.data))
    .slice(0, 3);

  const margens = products.map((p) => margemInfo(p.custo, p.precoVenda));
  const critCount = margens.filter((m) => m.tone === "critica").length;
  const okCount = margens.filter((m) => m.tone === "saudavel").length;

  const totalVendasMes = sales
    .filter((s) => s.data?.slice(0, 7) === today.slice(0, 7))
    .reduce((acc, s) => acc + Number(s.valorTotal || 0), 0);

  async function buscarClima(nomeCidade) {
    if (!nomeCidade) return;
    setWLoading(true);
    try {
      const geo = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(nomeCidade)}&count=1&language=pt&format=json`).then(r => r.json());
      const loc = geo?.results?.[0];
      if (!loc) { setWeather(null); setWLoading(false); return; }
      const f = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${loc.latitude}&longitude=${loc.longitude}&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=auto&forecast_days=5`).then(r => r.json());
      setWeather({ place: `${loc.name}${loc.admin1 ? ", " + loc.admin1 : ""}`, daily: f.daily });
    } catch { setWeather(null); }
    setWLoading(false);
  }
  useEffect(() => { if (city) buscarClima(city); }, []); // eslint-disable-line

  return (
    <div>
      <Header sub="Painel geral" title="Bom trabalho de campo" />
      <div className="px-5 -mt-2 space-y-4 mt-4">
        <div className="grid grid-cols-3 gap-2">
          <StatCard label="Produtores" value={producers.length} icon={Users} />

                {weather.daily.time.map((t, i) => {

                      <span className="flex items-center gap-0.5 text-[9px] mt-1" style={{ color: "#9FBB8E" }}>
                        <Droplets size={9} />{weather.daily.precipitation_probability_max[i]}%
                      </span>

  }
  function remove(id) { setVisits(visits.filter(v => v.id !== id)); }
  function toggleStatus(v) { setVisits(visits.map(x => x.id === v.id ? { ...x, status: x.status === "Realizada" ? "Agendada" : "Realizada" } : x)); }

  const sorted = [...visits].sort((a, b) => a.data.localeCompare(b.data));

  return (
    <div>

          <div className="space-y-2 pb-2">

                            {v.produtos.map(pid => {
                              const pr = products.find(x => x.id === pid);

                      <button onClick={() => setEditing(v)} className="p-1.5"><Pencil size={14} color="#A79B79" /></button>
                      <button onClick={() => remove(v.id)} className="p-1.5"><Trash2 size={14} color="#A79B79" /></button>

                  </div>
                </div>

            })}

function Produtos({ products, setProducts }) {
  const [editing, setEditing] = useState(null);
  const [selected, setSelected] = useState(null);
  const [calcOpen, setCalcOpen] = useState(false);
  const [view, setView] = useState("lista");
  const [activeCrop, setActiveCrop] = useState(CROPS[0]);
  const [cropEditing, setCropEditing] = useState(null);
  const [noteProductId, setNoteProductId] = useState(null);
  const [noteText, setNoteText] = useState("");

  function upsert(data) {
    if (data.id) setProducts(products.map(p => p.id === data.id ? { ...p, ...data, culturas: p.culturas || [], anotacoes: p.anotacoes || [] } : p));
    else setProducts([...products, { ...data, id: uid(), culturas: [], anotacoes: [] }]);
    setEditing(null);
  }
  function remove(id) { setProducts(products.filter(p => p.id !== id)); setSelected(null); }
  function loadPresets() {
    const existingNames = products.map(p => p.nome.toLowerCase());
    const toAdd = STOLLER_PRESETS.filter(p => !existingNames.includes(p.nome.toLowerCase()))
      .map(p => ({ ...p, id: uid(), culturas: p.culturas.map(c => ({ ...c, id: uid() })), anotacoes: [] }));
    if (toAdd.length) setProducts([...products, ...toAdd]);
  }
  function saveCropDose(productId, entry) {
    setProducts(products.map(p => {
      if (p.id !== productId) return p;
      const culturas = p.culturas || [];
      const exists = culturas.some(c => c.id === entry.id);
      return { ...p, culturas: exists ? culturas.map(c => c.id === entry.id ? entry : c) : [...culturas, { ...entry, id: entry.id || uid() }] };
    }));
    setCropEditing(null);
  }
  function removeCropDose(productId, entryId) {
    setProducts(products.map(p => p.id === productId ? { ...p, culturas: (p.culturas || []).filter(c => c.id !== entryId) } : p));
  }
  function addNote(productId, texto) {
    if (!texto.trim()) return;
    setProducts(products.map(p => p.id === productId
      ? { ...p, anotacoes: [{ id: uid(), data: new Date().toISOString().slice(0, 10), texto: texto.trim() }, ...(p.anotacoes || [])] }
      : p));
    setNoteText("");
  }
  function removeNote(productId, noteId) {
    setProducts(products.map(p => p.id === productId ? { ...p, anotacoes: (p.anotacoes || []).filter(n => n.id !== noteId) } : p));
  }

  if (selected) {
    const p = products.find(x => x.id === selected);
    if (!p) { setSelected(null); return null; }
    const m = margemInfo(p.custo, p.precoVenda);
    const t = TONE[m.tone]; const TIcon = t.icon;
    const culturas = p.culturas || [];
    return (
      <div>
        <div className="px-5 pt-6 pb-4" style={{ background: "#1F3B2C" }}>
          <button onClick={() => setSelected(null)} className="flex items-center gap-1 text-sm mb-3" style={{ color: "#9FBB8E" }}><ArrowLeft size={15} /> Produtos</button>
          <div className="flex items-center justify-between">
            <h1 className="text-xl font-bold text-white" style={{ fontFamily: "Fraunces, serif" }}>{p.nome}</h1>
            <div className="flex gap-2">
              <button onClick={() => setCalcOpen(true)} className="p-2 rounded-full" style={{ background: "#31563E" }} title="Calculadora de margem"><Calculator size={15} color="white" /></button>
              <button onClick={() => setEditing(p)} className="p-2 rounded-full" style={{ background: "#31563E" }}><Pencil size={15} color="white" /></button>
              <button onClick={() => remove(p.id)} className="p-2 rounded-full" style={{ background: "#31563E" }}><Trash2 size={15} color="#F0AFA3" /></button>
            </div>
          </div>
          <p className="text-sm mt-0.5" style={{ color: "#C9DBBF" }}>{p.categoria}{culturas.length ? ` · ${culturas.map(c => c.cultura).join(", ")}` : ""}</p>
        </div>
        <div className="px-5 py-4 space-y-4">
          <div className="rounded-2xl p-4" style={{ background: t.bg }}>
            <div className="flex items-center gap-2 mb-2">
              <TIcon size={18} color={t.color} />
              <span className="font-bold" style={{ color: t.color }}>Margem {t.text}</span>
            </div>
            <p className="text-3xl font-bold mono" style={{ color: t.color }}>{m.pct !== null ? `${m.pct.toFixed(1)}%` : "—"}</p>
            <div className="flex justify-between text-sm mt-3 pt-3 border-t" style={{ borderColor: `${t.color}33` }}>

    </div>

}
function CropDoseForm({ initial, onSave, onClose }) {
  const [f, setF] = useState({
    id: initial.id, cultura: initial.cultura || CROPS[0], outra: CROPS.includes(initial.cultura) ? "" : (initial.cultura || ""),
    estagio: initial.estagio || "", dose: initial.dose || "", posicionamento: initial.posicionamento || "",
  });
  const isOutra = f.cultura === "Outra";
  const up = (k) => (e) => setF({ ...f, [k]: e.target.value });
  function handleSave() {
    const cultura = isOutra ? f.outra.trim() : f.cultura;
    if (!cultura) return;
    onSave({ id: f.id, cultura, estagio: f.estagio, dose: f.dose, posicionamento: f.posicionamento });
  }
  return (
    <Sheet title={initial.id ? "Editar dose por cultura" : "Nova dose por cultura"} onClose={onClose}>
      <Field label="Cultura">
        <select className={inputCls} style={inputStyle} value={f.cultura} onChange={up("cultura")}>
          {CROPS.map(c => <option key={c} value={c}>{c}</option>)}
          <option value="Outra">Outra cultura...</option>
        </select>
      </Field>
      {isOutra && (
        <Field label="Nome da cultura"><input className={inputCls} style={inputStyle} value={f.outra} onChange={up("outra")} placeholder="Ex: Café" /></Field>
      )}
      <Field label="Estágio de aplicação"><input className={inputCls} style={inputStyle} value={f.estagio} onChange={up("estagio")} placeholder="Ex: V4, início do florescimento (R1), perfilhamento" /></Field>
      <Field label="Dose"><input className={inputCls} style={inputStyle} value={f.dose} onChange={up("dose")} placeholder="Ex: 0,5 L/ha" /></Field>
      <Field label="Posicionamento"><textarea className={inputCls} style={inputStyle} rows={3} value={f.posicionamento} onChange={up("posicionamento")} placeholder="Objetivo da aplicação nesse estágio" /></Field>
      <button onClick={handleSave} className="w-full py-3 rounded-xl font-semibold text-white mt-2" style={{ background: "#1F3B2C" }}>
        Salvar dose
      </button>
    </Sheet>
  );
}

// ---------- VENDAS ----------
function Vendas({ sales, setSales, producers, products }) {
  const [editing, setEditing] = useState(null);
  function upsert(data) {
    if (data.id) setSales(sales.map(s => s.id === data.id ? data : s));
    else setSales([...sales, { ...data, id: uid() }]);
    setEditing(null);
  }
  function remove(id) { setSales(sales.filter(s => s.id !== id)); }
  const sorted = [...sales].sort((a, b) => b.data.localeCompare(a.data));
  const total = sales.reduce((acc, s) => acc + Number(s.valorTotal || 0), 0);

  return (
    <div>
      <Header sub={`Total ${fmtBRL(total)}`} title="Histórico de vendas" right={
        <button onClick={() => setEditing({})} disabled={producers.length===0 || products.length===0} className="p-2 rounded-full disabled:opacity-40" style={{ background: "#4C7A3D" }}><Plus size={18} color="white" /></button>
      } />
      <div className="px-5 pt-4">
        {producers.length === 0 || products.length === 0 ? (
          <EmptyState icon={DollarSign} title="Cadastre produtores e produtos" sub="É preciso ao menos um de cada para registrar vendas." />
        ) : sorted.length === 0 ? (
          <EmptyState icon={DollarSign} title="Nenhuma venda" sub="Toque em + para registrar a primeira venda." />
        ) : (
          <div className="space-y-2 pb-2">
            {sorted.map(s => {
              const prod = producers.find(p => p.id === s.producerId);
              const item = products.find(p => p.id === s.productId);
              return (
                <div key={s.id} className="flex items-center gap-3 p-3 rounded-xl border" style={{ borderColor: "#E4DAC0" }}>
                  <div className="w-10 h-10 rounded-lg flex items-center justify-center shrink-0" style={{ background: "#F3ECD8" }}>
                    <DollarSign size={17} color="#6B5A2E" />
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="font-semibold text-sm truncate" style={{ color: "#2B2418" }}>{item?.nome || "Produto removido"}</p>
                    <p className="text-xs truncate" style={{ color: "#8A7C5C" }}>{prod?.nome || "Produtor removido"} · {fmtDate(s.data)} · {s.quantidade}x</p>
                  </div>
                  <span className="mono font-bold text-sm shrink-0" style={{ color: "#1F3B2C" }}>{fmtBRL(s.valorTotal)}</span>
                  <button onClick={() => remove(s.id)} className="p-1 shrink-0"><Trash2 size={14} color="#A79B79" /></button>
                </div>
              );
            })}
          </div>
        )}
      </div>
      {editing && <SaleForm initial={editing} producers={producers} products={products} onSave={upsert} onClose={() => setEditing(null)} />}
    </div>
  );
}
function SaleForm({ initial, producers, products, onSave, onClose }) {
  const [f, setF] = useState({
    producerId: initial.producerId || producers[0]?.id || "",
    productId: initial.productId || products[0]?.id || "",
    quantidade: initial.quantidade || 1,
    data: initial.data || new Date().toISOString().slice(0,10),
    valorTotal: initial.valorTotal || "", id: initial.id,
  });
  useEffect(() => {
    const prod = products.find(p => p.id === f.productId);
    if (prod && !initial.id) setF(prev => ({ ...prev, valorTotal: (Number(prod.precoVenda) * Number(f.quantidade || 0)).toFixed(2) }));
  }, [f.productId, f.quantidade]); // eslint-disable-line
  const up = (k) => (e) => setF({ ...f, [k]: e.target.value });
  return (
    <Sheet title={initial.id ? "Editar venda" : "Nova venda"} onClose={onClose}>
      <Field label="Produtor">
        <select className={inputCls} style={inputStyle} value={f.producerId} onChange={up("producerId")}>
          {producers.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select>
      </Field>
      <Field label="Produto">
        <select className={inputCls} style={inputStyle} value={f.productId} onChange={up("productId")}>
          {products.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
        </select>
      </Field>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Quantidade"><input type="number" min="1" className={inputCls + " mono"} style={inputStyle} value={f.quantidade} onChange={up("quantidade")} /></Field>
        <Field label="Data"><input type="date" className={inputCls} style={inputStyle} value={f.data} onChange={up("data")} /></Field>
      </div>
      <Field label="Valor total (R$)"><input type="number" step="0.01" className={inputCls + " mono"} style={inputStyle} value={f.valorTotal} onChange={up("valorTotal")} /></Field>
      <button onClick={() => f.producerId && f.productId && onSave(f)} className="w-full py-3 rounded-xl font-semibold text-white mt-2" style={{ background: "#1F3B2C" }}>
        Salvar venda
      </button>
    </Sheet>
  );
}

// ---------- CALCULADORA DE MARGEM ----------
function MarginCalculator({ products, initialProductId, onClose }) {
  const [productId, setProductId] = useState(initialProductId || "");
  const [custo, setCusto] = useState("");
  const [preco, setPreco] = useState("");
  const [margemAlvo, setMargemAlvo] = useState("");

  useEffect(() => {
    if (initialProductId) {
      const p = products.find(x => x.id === initialProductId);
      if (p) { setCusto(p.custo || ""); setPreco(p.precoVenda || ""); }
    }
  }, []); // eslint-disable-line

  function applyProduct(id) {
    setProductId(id);
    const p = products.find(x => x.id === id);
    if (p) { setCusto(p.custo || ""); setPreco(p.precoVenda || ""); }
  }

  const m = margemInfo(custo, preco);
  const t = TONE[m.tone];
  const TIcon = t.icon;
  const lucroUnit = (Number(preco) || 0) - (Number(custo) || 0);
  const markup = Number(custo) ? (lucroUnit / Number(custo)) * 100 : null;

  const precoNecessario = (custo && margemAlvo && Number(margemAlvo) < 100)
    ? Number(custo) / (1 - Number(margemAlvo) / 100)
    : null;

  function reset() { setCusto(""); setPreco(""); setMargemAlvo(""); setProductId(""); }

  return (
    <Sheet title="Calculadora de margem" onClose={onClose}>
      {products.length > 0 && (
        <Field label="Carregar valores de um produto (opcional)">
          <select className={inputCls} style={inputStyle} value={productId} onChange={e => applyProduct(e.target.value)}>
            <option value="">Digitar manualmente</option>
            {products.map(p => <option key={p.id} value={p.id}>{p.nome}</option>)}
          </select>
        </Field>
      )}

      <div className="grid grid-cols-2 gap-2">
        <Field label="Custo (R$)">
          <input type="number" step="0.01" className={inputCls + " mono"} style={inputStyle} value={custo} onChange={e => setCusto(e.target.value)} placeholder="0,00" />
        </Field>
        <Field label="Preço de venda (R$)">
          <input type="number" step="0.01" className={inputCls + " mono"} style={inputStyle} value={preco} onChange={e => setPreco(e.target.value)} placeholder="0,00" />
        </Field>
      </div>

      <div className="rounded-2xl p-4 mb-4" style={{ background: t.bg }}>
        <div className="flex items-center gap-2 mb-1">
          <TIcon size={17} color={t.color} />
          <span className="text-sm font-bold" style={{ color: t.color }}>Margem {t.text}</span>
        </div>
        <p className="text-3xl font-bold mono" style={{ color: t.color }}>{m.pct !== null ? `${m.pct.toFixed(1)}%` : "—"}</p>
        <div className="grid grid-cols-2 gap-2 mt-3 pt-3 border-t text-sm" style={{ borderColor: `${t.color}33` }}>
          <span style={{ color: t.color }}>Lucro/un: <b className="mono">{fmtBRL(lucroUnit)}</b></span>
          <span style={{ color: t.color }}>Markup: <b className="mono">{markup !== null ? `${markup.toFixed(1)}%` : "—"}</b></span>
        </div>
      </div>

      <div className="rounded-xl border p-3.5 mb-2" style={{ borderColor: "#E4DAC0" }}>
        <div className="flex items-center gap-2 mb-2">
          <RefreshCw size={14} color="#8A7C5C" />
          <span className="text-[11px] uppercase tracking-wide font-semibold" style={{ color: "#8A7C5C" }}>Cálculo reverso</span>
        </div>
        <Field label="Margem desejada (%)">
          <input type="number" step="0.1" className={inputCls + " mono"} style={inputStyle} value={margemAlvo} onChange={e => setMargemAlvo(e.target.value)} placeholder="Ex: 30" />
        </Field>
        {precoNecessario !== null ? (
          <div className="rounded-lg px-3 py-2 flex items-center justify-between" style={{ background: "#F3ECD8" }}>
            <span className="text-xs font-semibold" style={{ color: "#6B5A2E" }}>Preço de venda necessário</span>
            <span className="font-bold mono" style={{ color: "#1F3B2C" }}>{fmtBRL(precoNecessario)}</span>
          </div>
        ) : (
          <p className="text-xs" style={{ color: "#8A7C5C" }}>Informe custo e margem desejada (abaixo de 100%) para calcular o preço necessário.</p>
        )}
      </div>

      <button onClick={reset} className="w-full py-2.5 rounded-xl font-semibold text-sm mt-1" style={{ background: "#EFE7D2", color: "#6B5A2E" }}>
        Limpar campos
      </button>
    </Sheet>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
